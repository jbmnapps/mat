name: Deploy til GitHub Pages

on:
  push:
    branches: [weekend]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /mat
          # Supabase-credentials. Sættes som GitHub Secrets i repo-settings.
          # Hvis de ikke er sat, bygger vi stadig — login-siden viser bare
          # "Login er ikke klar" og localStorage fortsætter som primær kilde.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_LAERER_TOKEN: ${{ secrets.NEXT_PUBLIC_LAERER_TOKEN }}
        run: npm run build

      - name: Tilføj .nojekyll (for at bevare _next-mappen)
        run: touch out/.nojekyll

      - name: Push til gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          # Bevar manuelt-pushede undermapper (fx share/) på tværs af deploys
          keep_files: true
          exclude_assets: ''
